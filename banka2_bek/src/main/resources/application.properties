spring.application.name=banka2_bek
spring.datasource.url=jdbc:mysql://localhost:3307/banka2
spring.datasource.username=banka2user
spring.datasource.password=banka2pass

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Mail (override in application-local.properties or env)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification URLs (for links in emails)
notification.activation-url-base=http://localhost:8080
notification.password-reset-url-base=http://localhost:8080